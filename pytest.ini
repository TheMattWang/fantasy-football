[pytest]
# `test_nflverse.py` has claimed since it was written that "network-dependent
# tests are marked and skipped by default". There was no config, so they were
# not -- the claim was aspirational. This makes it true.
#
# It matters more now than it did: the loop runs unattended, and a suite that
# reaches the network turns somebody else's outage into a red build here.
# Run them deliberately with `-m network`.
markers =
    network: hits a live feed; deselected by default
addopts = -m "not network"
